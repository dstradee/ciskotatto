<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consentimiento - Ciskotattoo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#282828', 'brand-accent': '#A0A0A0', 'brand-light': '#F5F5F5', 'brand-border': '#E0E0E0'
                    },
                    fontFamily: { 'heading': ['Montserrat', 'sans-serif'], 'body': ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <style>
        body { background-color: #FFFFFF; color: #000000; }
        * { border-radius: 2px !important; }
        input[type="text"], input[type="date"], input[type="tel"], textarea, select { width: 100%; border: 1px solid #E0E0E0; padding: 0.75rem; font-family: 'Inter', sans-serif; }
        input:focus, select:focus { outline: none; border-color: #282828; }
        label { display: block; margin-bottom: 0.25rem; color: #A0A0A0; text-transform: uppercase; font-size: 0.75rem; font-weight: bold; }
        .section-title { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #E0E0E0; padding-bottom: 0.5rem; margin-bottom: 1.5rem; margin-top: 2rem; }
    </style>
</head>
<body class="font-body pb-10 bg-brand-light">

    <header class="bg-white py-8 px-4 text-center border-b border-brand-border shadow-sm mb-8">
        <h1 class="text-3xl font-heading uppercase tracking-widest text-brand-dark font-bold">Ciskotattoo</h1>
        <p class="mt-2 font-body font-semibold uppercase text-xs text-brand-accent tracking-[0.2em]">Firma de Consentimiento Oficial</p>
    </header>

    <main class="max-w-3xl mx-auto px-4">
        
        <!-- PANTALLA DE CARGA / ERROR -->
        <div id="loading-screen" class="text-center py-20">
            <h2 class="text-xl font-heading font-bold text-brand-dark">Conectando con el estudio...</h2>
            <p class="text-brand-accent mt-2 text-sm">Cargando los detalles de tu sesión.</p>
        </div>

        <!-- FORMULARIO DEL CLIENTE -->
        <form id="consent-form" class="hidden bg-white p-6 md:p-10 border border-brand-border shadow-sm">
            
            <div class="bg-brand-dark text-white p-4 mb-6 text-sm text-center font-semibold">
                Sesión asignada a: <span id="ui-tat-nombre" class="text-brand-accent"></span>
            </div>

            <!-- DATOS DEL CLIENTE -->
            <h2 class="section-title mt-0">1. Tus Datos Personales</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2"><label>Nombre y Apellidos</label><input type="text" id="cliente_nombre" required></div>
                <div><label>Fecha de Nacimiento</label><input type="date" id="cliente_nacimiento" required></div>
                <div><label>DNI / NIE / Pasaporte</label><input type="text" id="cliente_dni" required class="uppercase"></div>
                <div class="md:col-span-2">
                    <label>Sexo</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-bold"><input type="radio" name="c_sexo" id="cliente_sexo_h" class="accent-brand-dark" required> Hombre</label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-bold"><input type="radio" name="c_sexo" id="cliente_sexo_m" class="accent-brand-dark"> Mujer</label>
                    </div>
                </div>
                <div><label>Tipo Vía (Ej: Calle)</label><input type="text" id="cliente_tipo_via" required></div>
                <div><label>Nombre de la Vía</label><input type="text" id="cliente_nombre_via" required></div>
                <div><label>Número/Piso</label><input type="text" id="cliente_numero" required></div>
                <div><label>Población</label><input type="text" id="cliente_poblacion" required></div>
                <div><label>Provincia</label><input type="text" id="cliente_provincia" required></div>
                <div><label>Código Postal</label><input type="text" id="cliente_cp" required></div>
                <div><label>Teléfono</label><input type="tel" id="cliente_telefono" required></div>
            </div>

            <!-- REPRESENTANTE LEGAL -->
            <div id="bloque_representante" class="hidden bg-gray-50 p-4 border border-brand-border mt-6">
                <h2 class="text-brand-red font-bold text-sm uppercase mb-4 tracking-widest">⚠️ Autorización Menor de Edad (Representante Legal)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2"><label>Nombre y Apellidos (Tutor)</label><input type="text" id="rep_nombre"></div>
                    <div><label>DNI / NIE</label><input type="text" id="rep_dni" class="uppercase"></div>
                    <div class="md:col-span-2">
                        <label>Sexo Tutor</label>
                        <div class="flex gap-4">
                            <label class="text-sm font-bold"><input type="radio" name="r_sexo" id="rep_sexo_h" class="accent-brand-dark"> Hombre</label>
                            <label class="text-sm font-bold"><input type="radio" name="r_sexo" id="rep_sexo_m" class="accent-brand-dark"> Mujer</label>
                        </div>
                    </div>
                    <div><label>Tipo Vía</label><input type="text" id="rep_tipo_via"></div>
                    <div><label>Nombre Vía</label><input type="text" id="rep_nombre_via"></div>
                    <div><label>Número</label><input type="text" id="rep_numero"></div>
                    <div><label>Población</label><input type="text" id="rep_poblacion"></div>
                    <div><label>Provincia</label><input type="text" id="rep_provincia"></div>
                    <div><label>CP</label><input type="text" id="rep_cp"></div>
                    <div><label>Teléfono Tutor</label><input type="tel" id="rep_telefono"></div>
                </div>
            </div>

            <!-- CUESTIONARIO SALUD -->
            <h2 class="section-title">2. Cuestionario y Conformidad</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-brand-light p-4 border border-brand-border">
                <div class="mb-2"><label>¿Entiende que es permanente?</label><select id="permanente"><option value="SI">SÍ</option><option value="NO">NO</option></select></div>
                <div class="mb-2"><label>¿Es para toda la vida?</label><select id="toda_vida"><option value="SI">SÍ</option><option value="NO">NO</option></select></div>
                <div class="mb-2"><label>¿Asume posible decoloración?</label><select id="alteracion"><option value="SI">SÍ</option><option value="NO">NO</option></select></div>
                <div class="mb-2"><label>¿Entiende que puede requerir retoques?</label><select id="retoques"><option value="SI">SÍ</option><option value="NO">NO</option></select></div>
            </div>

            <!-- FIRMA DIGITAL -->
            <h2 class="section-title">3. Firma Electrónica</h2>
            <div class="space-y-4">
                <div><label>Localidad actual (Ej: Sevilla)</label><input type="text" id="fecha_ciudad" required></div>
                
                <div class="bg-brand-light p-5 border border-brand-dark mt-4">
                    <label class="flex items-start gap-4 cursor-pointer normal-case text-brand-dark font-normal">
                        <input type="checkbox" id="check_firma_digital" required class="mt-1 w-6 h-6 accent-brand-dark flex-shrink-0">
                        <span class="text-sm font-semibold leading-relaxed">
                            Declaro la veracidad de mis datos. <b>Firmo electrónicamente</b> este consentimiento, dando validez legal a mi DNI y a la marca de tiempo exacta del servidor.
                        </span>
                    </label>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-brand-dark text-white border border-brand-dark font-heading font-bold text-lg py-5 mt-8 uppercase transition-all tracking-widest hover:bg-white hover:text-brand-dark">
                Aceptar y Finalizar
            </button>
            
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
