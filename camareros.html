<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipo - Ciskotattoo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-bg': '#FFFFFF',
                        'brand-text': '#000000',
                        'brand-dark': '#282828', 
                        'brand-accent': '#A0A0A0',
                        'brand-light': '#F5F5F5',
                        'brand-border': '#E0E0E0'
                    },
                    fontFamily: {
                        'heading': ['Montserrat', 'sans-serif'],
                        'body': ['Inter', 'sans-serif']
                    },
                    boxShadow: {
                        'minimal': '0 2px 5px rgba(0, 0, 0, 0.05)',
                        'hover': '0 4px 12px rgba(0, 0, 0, 0.1)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FFFFFF; color: #000000; margin: 0; padding: 0; }
        * { border-radius: 2px !important; }
        input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; }
    </style>
</head>
<body class="bg-brand-bg text-brand-text min-h-screen font-body pb-20">

<header class="bg-brand-bg py-5 px-4 border-b border-brand-border sticky top-0 z-50 shadow-minimal">
    <div class="flex justify-between items-center mb-5 max-w-4xl mx-auto">
        <h1 class="text-xl font-heading uppercase text-brand-dark tracking-widest font-bold">Ciskotattoo</h1>
        <span id="estado" class="text-brand-accent font-body font-semibold text-xs uppercase tracking-widest border border-brand-accent px-2 py-1">Cargando...</span>
    </div>
    
    <div class="flex gap-3 max-w-4xl mx-auto">
        <button onclick="verPestaña('estudio')" id="tab-estudio" class="flex-1 bg-brand-dark text-white border border-brand-dark font-heading font-bold py-3 uppercase text-sm tracking-[0.2em] transition-colors">
            Estudio Vivo
        </button>
        <button onclick="verPestaña('reservas')" id="tab-reservas" class="flex-1 bg-white text-brand-accent border border-brand-border font-heading font-bold py-3 uppercase text-sm tracking-[0.2em] hover:text-brand-dark transition-colors">
            Agenda
        </button>
    </div>
</header>

<main class="p-4 max-w-4xl mx-auto mt-4">
    
    <!-- VISTA ESTUDIO -->
    <div id="vista-estudio" class="space-y-6 block">
        <div class="bg-white border-l-4 border-brand-dark p-5 text-brand-dark font-body shadow-minimal mb-6 text-sm tracking-wide">
            ⚜️ Pulsa "Ocupar" si te entra un cliente de improvisto para bloquearte en internet al instante.
        </div>
        
        <div id="contenedor-tatuadores" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <p class="text-brand-accent font-light text-center col-span-2">Cargando equipo...</p>
        </div>
    </div>

    <!-- VISTA AGENDA -->
    <div id="vista-reservas" class="hidden space-y-6">
        
        <!-- FORMULARIO CITA MANUAL AVANZADO -->
        <div class="bg-brand-light p-6 border border-brand-border shadow-minimal">
            <h3 class="text-brand-dark font-heading font-bold uppercase tracking-widest mb-4">Agendar Tatuaje / Sesión Larga</h3>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-4">
                <input type="date" id="man-fecha" class="w-full bg-white border border-brand-border p-3 text-brand-text font-body focus:outline-none focus:border-brand-dark">
                <input type="time" id="man-hora" class="w-full bg-white border border-brand-border p-3 text-brand-text font-body focus:outline-none focus:border-brand-dark">
                
                <select id="man-duracion" class="w-full bg-white border border-brand-border p-3 text-brand-text font-body focus:outline-none focus:border-brand-dark font-semibold">
                    <option value="60">1 Hora (Calco/Pequeño)</option>
                    <option value="120">2 Horas</option>
                    <option value="180">3 Horas</option>
                    <option value="240">4 Horas</option>
                    <option value="300" selected>5 Horas (Sesión Larga)</option>
                    <option value="360">6 Horas</option>
                    <option value="420">7 Horas</option>
                    <option value="480">8 Horas (Día Completo)</option>
                </select>

                <select id="man-tat" class="w-full bg-white border border-brand-border p-3 text-brand-text font-body focus:outline-none focus:border-brand-dark">
                    <option value="">Tatuador...</option>
                </select>
                <input type="text" id="man-nombre" placeholder="Nombre Cliente" class="w-full bg-white border border-brand-border p-3 text-brand-text font-body focus:outline-none focus:border-brand-dark md:col-span-1 col-span-2">
            </div>
            <button onclick="añadirCitaManual()" id="btn-manual" class="w-full bg-brand-dark text-white border border-brand-dark font-heading font-bold py-3 uppercase text-sm tracking-[0.2em] transition-colors hover:bg-white hover:text-brand-dark">
                Bloquear en Agenda
            </button>
        </div>

        <div class="bg-brand-light p-6 border border-brand-border shadow-minimal">
            <label class="block text-brand-accent font-body font-semibold mb-3 uppercase text-xs tracking-[0.2em]">Ver Agenda del Día</label>
            <input type="date" id="input-fecha-lista" onchange="descargarListaReservas()" class="w-full bg-white border border-brand-border p-4 text-brand-text font-body font-light focus:outline-none focus:border-brand-dark transition-colors">
        </div>

        <div id="caja-reservas" class="space-y-4 mt-6 font-body">
            <p class="text-center font-light text-brand-accent tracking-wide">Haz clic en el calendario para buscar citas...</p>
        </div>
    </div>

</main>

<script>
    function verPestaña(cual) {
        if (cual === 'estudio') {
            document.getElementById('vista-estudio').classList.remove('hidden');
            document.getElementById('vista-reservas').classList.add('hidden');
            document.getElementById('tab-estudio').className = "flex-1 bg-brand-dark text-white border border-brand-dark font-heading font-bold py-3 uppercase text-sm tracking-[0.2em] transition-colors";
            document.getElementById('tab-reservas').className = "flex-1 bg-white text-brand-accent border border-brand-border font-heading font-bold py-3 uppercase text-sm tracking-[0.2em] hover:text-brand-dark transition-colors";
        } else {
            document.getElementById('vista-estudio').classList.add('hidden');
            document.getElementById('vista-reservas').classList.remove('hidden');
            document.getElementById('tab-reservas').className = "flex-1 bg-brand-dark text-white border border-brand-dark font-heading font-bold py-3 uppercase text-sm tracking-[0.2em] transition-colors";
            document.getElementById('tab-estudio').className = "flex-1 bg-white text-brand-accent border border-brand-border font-heading font-bold py-3 uppercase text-sm tracking-[0.2em] hover:text-brand-dark transition-colors";
            
            if(!document.getElementById('input-fecha-lista').value) {
                const d = new Date();
                document.getElementById('input-fecha-lista').value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                document.getElementById('man-fecha').value = document.getElementById('input-fecha-lista').value;
            }
            
            if(typeof descargarListaReservas === "function") descargarListaReservas();
        }
    }

    const SUPABASE_URL = 'https://fqydtjwqkmdatfsauomh.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_-FdijJSiBiKFSY4I4F-LJw_fB89m4Cj';
    
    let todosLosTatuadores = [];
    let reservasDeHoy = [];

    async function actualizarDatos() {
        try {
            document.getElementById('estado').innerText = "Actualizando...";
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const d = new Date();
            const hoy = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            const resTat = await supabase.from('tatuadores').select('*').order('nombre');
            if (resTat.error) throw resTat.error;
            todosLosTatuadores = resTat.data || [];

            const selMan = document.getElementById('man-tat');
            if(selMan.options.length <= 1 && todosLosTatuadores.length > 0) {
                selMan.innerHTML = '<option value="">Tatuador...</option>';
                todosLosTatuadores.forEach(t => selMan.innerHTML += `<option value="${t.id}">${t.nombre}</option>`);
            }

            // AHORA TRAEMOS TAMBIÉN LA DURACIÓN
            const resReservas = await supabase.from('reservas').select('*').eq('fecha', hoy);
            if (resReservas.error) throw resReservas.error;
            reservasDeHoy = resReservas.data || [];

            pintarEstadoEstudio(d, hoy);

            document.getElementById('estado').innerText = "✓ ONLINE";
            document.getElementById('estado').className = "text-brand-dark border border-brand-dark font-body font-semibold text-xs uppercase tracking-widest px-2 py-1";
        } catch (error) {
            document.getElementById('estado').innerText = "❌ RECONECTANDO...";
            document.getElementById('estado').className = "text-red-700 border border-red-700 font-body font-semibold text-xs uppercase tracking-widest px-2 py-1";
        }
    }

    function timeToMins(t) {
        if(!t) return 0;
        let p = t.split(':');
        return parseInt(p[0]) * 60 + parseInt(p[1]);
    }

    function pintarEstadoEstudio(ahora, hoyIso) {
        const contenedor = document.getElementById('contenedor-tatuadores');
        if (todosLosTatuadores.length === 0) {
            contenedor.innerHTML = '<p class="text-brand-accent font-light text-center col-span-2">No hay tatuadores en la base de datos. Añádelos desde el Manager.</p>';
            return;
        }

        let html = "";
        let minsAhora = ahora.getHours() * 60 + ahora.getMinutes();

        todosLosTatuadores.forEach(tat => {
            let ocupadoManual = (tat.estado_actual === 'ocupada');
            
            // Comprueba si AHORA MISMO hay una cita activa teniendo en cuenta su DURACIÓN EXACTA
            let chocaConInternet = reservasDeHoy.some(r => {
                if (r.tatuador_id !== tat.id) return false;
                let minInicio = timeToMins(r.hora_inicio);
                let minFin = minInicio + (r.duracion || 60); // Si no tiene duración, asume 1h
                return (minsAhora >= minInicio && minsAhora < minFin);
            });

            let estaOcupado = ocupadoManual || chocaConInternet;
            let colorTexto = estaOcupado ? 'text-brand-red' : 'text-brand-dark';
            let mensaje = estaOcupado ? '🔴 EN SESIÓN' : '🟢 DISPONIBLE';

            html += `
            <div class="bg-brand-light p-8 border border-brand-border text-center shadow-minimal">
                <h2 class="text-2xl font-heading font-bold text-brand-dark uppercase mb-2 tracking-widest">${tat.nombre}</h2>
                <p class="text-brand-accent font-body font-semibold text-xs tracking-[0.2em] uppercase mb-6">Estado Actual</p>
                <div class="text-3xl font-heading font-bold mb-8 ${colorTexto} tracking-widest">${mensaje}</div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="ocupar('${tat.id}')" class="bg-brand-dark text-white border border-brand-dark hover:bg-white hover:text-brand-dark text-sm md:text-base font-heading font-bold py-4 uppercase transition-all tracking-[0.15em]">Ocupar</button>
                    <button onclick="liberar('${tat.id}')" class="bg-white text-brand-dark border border-brand-dark hover:bg-brand-dark hover:text-white text-sm md:text-base font-heading font-bold py-4 uppercase transition-all tracking-[0.15em]">Liberar</button>
                </div>
            </div>`;
        });
        contenedor.innerHTML = html;
    }

    async function ocupar(tatuadorId) {
        try {
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            await supabase.from('tatuadores').update({ estado_actual: 'ocupada' }).eq('id', tatuadorId);
            await actualizarDatos();
        } catch (error) { alert("❌ Fallo de red."); }
    }

    async function liberar(tatuadorId) {
        try {
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            await supabase.from('tatuadores').update({ estado_actual: 'libre' }).eq('id', tatuadorId);
            
            const ahora = new Date();
            let minsAhora = ahora.getHours() * 60 + ahora.getMinutes();
            
            let reservaQueEstorba = reservasDeHoy.find(r => {
                if (r.tatuador_id !== tatuadorId) return false;
                let minInicio = timeToMins(r.hora_inicio);
                let minFin = minInicio + (r.duracion || 60);
                return (minsAhora >= minInicio && minsAhora < minFin);
            });

            if (reservaQueEstorba) {
                if(confirm("Tienes una cita online activa. ¿Quieres marcarla como TERMINADA (se borrará de la agenda de hoy)?")) {
                    await supabase.from('reservas').delete().eq('id', reservaQueEstorba.id);
                }
            }
            await actualizarDatos();
        } catch (error) { alert("❌ Fallo de red."); }
    }

    async function añadirCitaManual() {
        const fecha = document.getElementById('man-fecha').value;
        const hora = document.getElementById('man-hora').value;
        const tatId = document.getElementById('man-tat').value;
        const duracion = parseInt(document.getElementById('man-duracion').value);
        let nombre = document.getElementById('man-nombre').value.trim();

        if(!fecha || !hora || !tatId) return alert("Rellena fecha, hora y tatuador.");
        if(!nombre) nombre = "Sesión Tatuaje";

        const btn = document.getElementById('btn-manual');
        btn.innerText = "⏳...";

        try {
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            // Comprobar colisiones antes de guardar
            const { data: reservasMismoTatuador } = await supabase.from('reservas').select('hora_inicio, duracion').eq('fecha', fecha).eq('tatuador_id', tatId);
            
            let minNuevo = timeToMins(hora);
            let finNuevo = minNuevo + duracion;

            let choque = (reservasMismoTatuador || []).some(r => {
                let rInicio = timeToMins(r.hora_inicio);
                let rFin = rInicio + (r.duracion || 60);
                // Si el inicio de la nueva es antes de que acabe la otra Y el fin de la nueva es después de que empiece la otra = CHOCAN
                return (minNuevo < rFin) && (finNuevo > rInicio);
            });

            if (choque) {
                btn.innerText = "Bloquear en Agenda";
                return alert("❌ Error: Esta sesión choca con otra cita que ya tienes en la agenda a esa hora.");
            }

            await supabase.from('reservas').insert([{
                tatuador_id: tatId,
                nombre_cliente: nombre,
                telefono_cliente: "000000000",
                fecha: fecha,
                hora_inicio: hora + ":00",
                duracion: duracion,
                codigo_secreto: "MANUAL"
            }]);
            
            document.getElementById('man-nombre').value = "";
            alert("✅ Agenda bloqueada con éxito.");
            
            if(document.getElementById('input-fecha-lista').value === fecha) descargarListaReservas();
            actualizarDatos();
        } catch (e) { alert("❌ Error al guardar."); }
        
        btn.innerText = "Bloquear en Agenda";
    }

    function formatMinutos(mins) {
        let h = Math.floor(mins / 60);
        return h + (h === 1 ? " hora" : " horas");
    }

    async function descargarListaReservas() {
        const fechaElegida = document.getElementById('input-fecha-lista').value;
        const caja = document.getElementById('caja-reservas');
        caja.innerHTML = '<p class="text-center font-body font-semibold text-brand-dark tracking-wide">Descargando agenda...</p>';

        try {
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            const { data: reservasDato, error } = await supabase
                .from('reservas')
                .select('hora_inicio, duracion, nombre_cliente, telefono_cliente, codigo_secreto, tatuadores(nombre)')
                .eq('fecha', fechaElegida)
                .order('hora_inicio', { ascending: true });

            if (error) throw error;

            if (!reservasDato || reservasDato.length === 0) {
                caja.innerHTML = `<div class="bg-brand-light p-8 border border-brand-border text-center"><p class="text-lg font-light text-brand-accent tracking-widest">Agenda vacía para este día.</p></div>`;
                return;
            }

            let contenidoHTML = "";
            reservasDato.forEach(res => {
                let horaLimpia = res.hora_inicio.substring(0, 5);
                let tatNombre = res.tatuadores ? res.tatuadores.nombre : "Sin asignar";
                let dur = res.duracion || 60;
                let durTexto = formatMinutos(dur);

                contenidoHTML += `
                    <div class="bg-white p-6 border border-brand-border border-l-4 border-l-brand-dark mb-4 shadow-minimal">
                        <div class="flex justify-between items-center border-b border-brand-border pb-3 mb-4">
                            <div>
                                <span class="text-2xl font-heading font-bold text-brand-dark tracking-widest block">${horaLimpia}</span>
                                <span class="text-xs font-body font-semibold text-brand-accent uppercase tracking-[0.15em]">⏳ ${durTexto} reservadas</span>
                            </div>
                            <span class="text-sm font-heading font-bold uppercase text-brand-accent tracking-[0.2em]">💉 ${tatNombre}</span>
                        </div>
                        <p class="text-lg font-body text-brand-text uppercase font-semibold tracking-wide">${res.nombre_cliente}</p>
                        ${res.telefono_cliente !== '000000000' ? `<p class="text-brand-accent font-light mt-1 tracking-wider">📞 ${res.telefono_cliente}</p>` : ''}
                    </div>
                `;
            });

            caja.innerHTML = contenidoHTML;

        } catch (error) {
            caja.innerHTML = '<p class="text-center font-light text-red-600">❌ Error de conexión al descargar agenda.</p>';
        }
    }

    setInterval(actualizarDatos, 5000);
    setTimeout(actualizarDatos, 500);

</script>
</body>
</html>
