<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipo - Ciskotattoo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'brand-bg': '#FFFFFF', 'brand-text': '#000000', 'brand-dark': '#282828', 'brand-accent': '#A0A0A0', 'brand-light': '#F5F5F5', 'brand-border': '#E0E0E0', 'brand-red': '#A12727' }, fontFamily: { 'heading': ['Montserrat', 'sans-serif'], 'body': ['Inter', 'sans-serif'] } } } }
    </script>
    <style> body { background-color: #FFFFFF; color: #000000; margin: 0; padding: 0; } * { border-radius: 2px !important; } input:focus, select:focus, textarea:focus { outline: none; border-color: #282828; } </style>
</head>
<body class="bg-brand-bg text-brand-text min-h-screen font-body pb-20">

<header class="bg-brand-bg py-5 px-4 border-b border-brand-border sticky top-0 z-50 shadow-sm">
    <div class="flex justify-between items-center mb-5 max-w-4xl mx-auto">
        <h1 class="text-xl font-heading uppercase text-brand-dark tracking-widest font-bold">Ciskotattoo</h1>
        <span id="estado" class="text-brand-accent font-body font-semibold text-xs uppercase tracking-widest border border-brand-accent px-2 py-1">Cargando...</span>
    </div>
    <div class="flex gap-2 max-w-4xl mx-auto overflow-x-auto">
        <button onclick="verPestaña('estudio')" id="tab-estudio" class="flex-1 bg-brand-dark text-white border border-brand-dark font-heading font-bold py-3 uppercase text-xs tracking-widest transition-colors whitespace-nowrap">Estudio Vivo</button>
        <button onclick="verPestaña('reservas')" id="tab-reservas" class="flex-1 bg-white text-brand-accent border border-brand-border font-heading font-bold py-3 uppercase text-xs tracking-widest transition-colors whitespace-nowrap hover:text-brand-dark">Agenda</button>
        <button onclick="verPestaña('boja')" id="tab-boja" class="flex-1 bg-white text-brand-accent border border-brand-border font-heading font-bold py-3 uppercase text-xs tracking-widest transition-colors whitespace-nowrap hover:text-brand-dark">📝 Crear BOJA</button>
    </div>
</header>

<main class="p-4 max-w-4xl mx-auto mt-4">
    
    <!-- ESTUDIO VIVO -->
    <div id="vista-estudio" class="space-y-6 block">
        <div id="contenedor-tatuadores" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <!-- AGENDA -->
    <div id="vista-reservas" class="hidden space-y-6">
        <div class="bg-brand-light p-6 border border-brand-border shadow-sm">
            <h3 class="text-brand-dark font-heading font-bold uppercase tracking-widest mb-4">Agendar Tatuaje Manual</h3>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-4">
                <input type="date" id="man-fecha" class="w-full border border-brand-border p-3">
                <input type="time" id="man-hora" class="w-full border border-brand-border p-3">
                <select id="man-duracion" class="w-full border border-brand-border p-3 font-bold bg-white"><option value="60">1 Hora</option><option value="180">3 Horas</option><option value="300" selected>5 Horas</option><option value="480">8 Horas</option></select>
                <select id="man-tat" class="w-full border border-brand-border p-3 bg-white"><option value="">Tatuador...</option></select>
                <input type="text" id="man-nombre" placeholder="Nombre Cliente" class="w-full border border-brand-border p-3 md:col-span-1 col-span-2">
            </div>
            <button onclick="añadirCitaManual()" class="w-full bg-brand-dark text-white font-bold py-3 uppercase hover:bg-white hover:text-brand-dark border border-brand-dark transition-all">Bloquear en Agenda</button>
        </div>
        <div class="bg-brand-light p-6 border border-brand-border shadow-sm">
            <input type="date" id="input-fecha-lista" onchange="descargarListaReservas()" class="w-full border border-brand-border p-4">
        </div>
        <div id="caja-reservas" class="space-y-4 mt-6"></div>
    </div>

    <!-- CREADOR DE BOJA PARA TATUADORES -->
    <div id="vista-boja" class="hidden space-y-6">
        <div class="bg-brand-light p-8 border border-brand-border shadow-sm">
            <h3 class="text-xl font-heading font-bold text-brand-dark uppercase mb-4 tracking-widest border-b border-brand-border pb-2">Generar Cita Nueva (BOJA)</h3>
            <p class="text-xs text-brand-accent mb-6">Ajusta los detalles técnicos de la sesión. El cliente verá estos datos pero no podrá editarlos.</p>
            
            <div class="space-y-4 text-sm font-body">
                <div>
                    <label class="font-bold text-xs text-brand-accent uppercase mb-1">Tu Nombre (Tatuador)</label>
                    <select id="boja-equipo-tat" class="w-full p-3 border border-brand-border bg-white"><option value="">Selecciona tu perfil...</option></select>
                </div>
                <div>
                    <label class="font-bold text-xs text-brand-accent uppercase mb-1">Zona Anatómica</label>
                    <input type="text" id="draft_zona" class="w-full p-3 border border-brand-border" placeholder="Ej: Antebrazo derecho">
                </div>
                <div>
                    <label class="font-bold text-xs text-brand-accent uppercase mb-1">Técnica</label>
                    <select id="draft_tecnica" class="w-full p-3 border border-brand-border bg-white">
                        <option value="TATUAJE">Tatuaje</option>
                        <option value="MICRO">Micropigmentación</option>
                        <option value="PIERCING">Piercing</option>
                    </select>
                </div>
                <div>
                    <label class="font-bold text-xs text-brand-accent uppercase mb-1">Materiales / Tintas</label>
                    <textarea id="draft_materiales" rows="2" class="w-full p-3 border border-brand-border" placeholder="Ej: Agujas Kwadron, Tinta Dynamic Black Lote #123"></textarea>
                </div>

                <!-- Cuestionario Técnico para el Tatuador -->
                <div class="grid grid-cols-2 gap-4 mt-2 border-t border-brand-border pt-4">
                    <div><label class="font-bold text-[10px] text-brand-accent uppercase mb-1">¿Permanente?</label><select id="draft_perm" class="w-full p-2 border border-brand-border bg-white font-bold"><option value="SI">SÍ</option><option value="NO">NO</option></select></div>
                    <div><label class="font-bold text-[10px] text-brand-accent uppercase mb-1">¿Toda la vida?</label><select id="draft_toda" class="w-full p-2 border border-brand-border bg-white font-bold"><option value="SI">SÍ</option><option value="NO">NO</option></select></div>
                    <div><label class="font-bold text-[10px] text-brand-accent uppercase mb-1">¿Alteración?</label><select id="draft_alt" class="w-full p-2 border border-brand-border bg-white font-bold"><option value="SI">SÍ</option><option value="NO">NO</option></select></div>
                    <div><label class="font-bold text-[10px] text-brand-accent uppercase mb-1">¿Retoques?</label><select id="draft_ret" class="w-full p-2 border border-brand-border bg-white font-bold"><option value="SI">SÍ</option><option value="NO">NO</option></select></div>
                </div>
            </div>

            <button onclick="equipoGenerarEnlaceBoja()" id="btn-eq-gen-link" class="mt-8 w-full bg-brand-dark text-white font-bold py-4 uppercase tracking-widest hover:bg-white hover:text-brand-dark border border-brand-dark transition-all">Crear Enlace Único</button>
            
            <div id="eq-link-box" class="hidden mt-6 bg-white p-4 border border-brand-dark">
                <input type="text" id="eq-url-output" readonly class="w-full p-3 bg-brand-light text-xs mb-3 border border-brand-border outline-none">
                <button onclick="equipoCopiarEnlaceBoja()" class="w-full bg-[#E0E0E0] text-brand-dark py-3 text-xs font-bold uppercase hover:bg-brand-dark hover:text-white transition-colors">Copiar Enlace para el Cliente</button>
            </div>
        </div>
    </div>

</main>

<script>
    function verPestaña(cual) {
        ['estudio', 'reservas', 'boja'].forEach(p => {
            document.getElementById(`vista-${p}`).classList.add('hidden');
            document.getElementById(`tab-${p}`).className = "flex-1 bg-white text-brand-accent border border-brand-border font-heading font-bold py-3 uppercase text-xs tracking-widest transition-colors whitespace-nowrap hover:text-brand-dark";
        });
        document.getElementById(`vista-${cual}`).classList.remove('hidden');
        document.getElementById(`tab-${cual}`).className = "flex-1 bg-brand-dark text-white border border-brand-dark font-heading font-bold py-3 uppercase text-xs tracking-widest transition-colors whitespace-nowrap";
        
        if (cual === 'reservas') {
            if(!document.getElementById('input-fecha-lista').value) {
                const d = new Date(); document.getElementById('input-fecha-lista').value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                document.getElementById('man-fecha').value = document.getElementById('input-fecha-lista').value;
            }
            descargarListaReservas();
        }
    }

    const SUPABASE_URL = 'https://fqydtjwqkmdatfsauomh.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_-FdijJSiBiKFSY4I4F-LJw_fB89m4Cj';
    let todosLosTatuadores = []; let reservasDeHoy = [];

    async function actualizarDatos() {
        try {
            document.getElementById('estado').innerText = "Actualizando...";
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const d = new Date(); const hoy = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

            const resTat = await supabase.from('tatuadores').select('*').order('nombre');
            todosLosTatuadores = resTat.data || [];

            const selMan = document.getElementById('man-tat');
            const selBoja = document.getElementById('boja-equipo-tat');
            if(selMan.options.length <= 1 && todosLosTatuadores.length > 0) {
                selMan.innerHTML = '<option value="">Tatuador...</option>';
                selBoja.innerHTML = '<option value="">Selecciona tu perfil...</option>';
                todosLosTatuadores.forEach(t => { 
                    selMan.innerHTML += `<option value="${t.id}">${t.nombre}</option>`;
                    selBoja.innerHTML += `<option value="${t.id}">${t.nombre}</option>`;
                });
            }

            const resReservas = await supabase.from('reservas').select('*').eq('fecha', hoy);
            reservasDeHoy = resReservas.data || [];

            pintarEstadoEstudio(d, hoy);
            document.getElementById('estado').innerText = "✓ ONLINE"; document.getElementById('estado').className = "text-brand-dark border border-brand-dark font-semibold text-xs px-2 py-1";
        } catch (error) { document.getElementById('estado').innerText = "❌ RECONECTANDO..."; document.getElementById('estado').className = "text-brand-red border border-brand-red font-semibold text-xs px-2 py-1"; }
    }

    function timeToMins(t) { if(!t) return 0; let p = t.split(':'); return parseInt(p[0]) * 60 + parseInt(p[1]); }

    function pintarEstadoEstudio(ahora, hoyIso) {
        const contenedor = document.getElementById('contenedor-tatuadores');
        if (todosLosTatuadores.length === 0) return contenedor.innerHTML = '<p>No hay tatuadores.</p>';
        let html = ""; let minsAhora = ahora.getHours() * 60 + ahora.getMinutes();
        todosLosTatuadores.forEach(tat => {
            let oM = (tat.estado_actual === 'ocupada');
            let cI = reservasDeHoy.some(r => { if (r.tatuador_id !== tat.id) return false; let minI = timeToMins(r.hora_inicio); return (minsAhora >= minI && minsAhora < minI + (r.duracion || 60)); });
            let ocu = oM || cI; let cTxt = ocu ? 'text-brand-red' : 'text-brand-dark'; let msj = ocu ? '🔴 EN SESIÓN' : '🟢 DISPONIBLE';
            html += `<div class="bg-brand-light p-8 border text-center shadow-sm"><h2 class="text-2xl font-bold uppercase mb-2">${tat.nombre}</h2><p class="text-xs tracking-widest uppercase mb-6">Estado Actual</p><div class="text-2xl font-bold mb-8 ${cTxt}">${msj}</div><div class="grid grid-cols-2 gap-4"><button onclick="ocupar('${tat.id}')" class="bg-brand-dark text-white py-4 font-bold uppercase hover:bg-white hover:text-brand-dark border border-brand-dark transition-all">Ocupar</button><button onclick="liberar('${tat.id}')" class="bg-white text-brand-dark border border-brand-dark hover:bg-brand-dark hover:text-white py-4 font-bold uppercase transition-all">Liberar</button></div></div>`;
        });
        contenedor.innerHTML = html;
    }

    async function ocupar(id) { try { await window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY).from('tatuadores').update({ estado_actual: 'ocupada' }).eq('id', id); actualizarDatos(); } catch (e) {} }
    async function liberar(id) { try { const sp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); await sp.from('tatuadores').update({ estado_actual: 'libre' }).eq('id', id); actualizarDatos(); } catch (e) {} }

    async function añadirCitaManual() {
        const f = document.getElementById('man-fecha').value; const h = document.getElementById('man-hora').value; const t = document.getElementById('man-tat').value; const d = parseInt(document.getElementById('man-duracion').value);
        if(!f || !h || !t) return;
        try {
            await window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY).from('reservas').insert([{ tatuador_id: t, nombre_cliente: document.getElementById('man-nombre').value||'Manual', telefono_cliente: "00", fecha: f, hora_inicio: h+":00", duracion: d, codigo_secreto: "MANUAL" }]);
            alert("Bloqueado en agenda."); actualizarDatos();
        } catch (e) { alert("Error"); }
    }

    async function descargarListaReservas() {
        const caja = document.getElementById('caja-reservas');
        try {
            const sp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data } = await sp.from('reservas').select('hora_inicio, duracion, nombre_cliente, tatuadores(nombre)').eq('fecha', document.getElementById('input-fecha-lista').value).order('hora_inicio');
            if (!data || data.length === 0) return caja.innerHTML = '<p class="text-center">Agenda vacía.</p>';
            let html = ""; data.forEach(r => { html += `<div class="bg-white p-6 border-l-4 border-brand-dark shadow-sm"><div class="flex justify-between items-center mb-2"><span class="text-xl font-bold">${r.hora_inicio.substring(0,5)}</span><span class="text-xs uppercase font-bold text-brand-accent">💉 ${r.tatuadores?r.tatuadores.nombre:'?'}</span></div><p class="font-bold">${r.nombre_cliente}</p></div>`; }); caja.innerHTML = html;
        } catch (e) { caja.innerHTML = '<p>Error</p>'; }
    }

    async function equipoGenerarEnlaceBoja() {
        const idTat = document.getElementById('boja-equipo-tat').value; 
        const zona = document.getElementById('draft_zona').value; 
        const tec = document.getElementById('draft_tecnica').value; 
        const mat = document.getElementById('draft_materiales').value;
        const perm = document.getElementById('draft_perm').value;
        const toda = document.getElementById('draft_toda').value;
        const alt = document.getElementById('draft_alt').value;
        const ret = document.getElementById('draft_ret').value;

        if (!idTat || !zona || !mat) return alert("Rellena la zona y los materiales.");
        const btn = document.getElementById('btn-eq-gen-link'); btn.innerText = "⏳...";
        try {
            const sp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data, error } = await sp.from('borradores_boja').insert([{ 
                id_tatuador: idTat, 
                zona_anatomica: zona, 
                tecnica: tec, 
                materiales: mat,
                permanente: perm,
                toda_vida: toda,
                alteracion: alt,
                retoques: ret
            }]).select('id').single();
            if (error) throw error;
            
            const baseUrl = window.location.origin + window.location.pathname.replace('equipo.html', '');
            document.getElementById('eq-url-output').value = `${baseUrl}/boja.html?draft_id=${data.id}`;
            document.getElementById('eq-link-box').classList.remove('hidden');
        } catch (e) { alert("Error"); }
        btn.innerText = "Crear Enlace Único";
    }

    function equipoCopiarEnlaceBoja() { document.getElementById('eq-url-output').select(); document.execCommand('copy'); alert("🔗 Enlace copiado. ¡Mándaselo al cliente!"); }

    setInterval(actualizarDatos, 5000); setTimeout(actualizarDatos, 500);
</script>
</body>
</html>
